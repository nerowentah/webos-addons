name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      native:
        description: 'Build the native Cobalt package (from the runtime pinned in runtime.lock.json)'
        type: boolean
        required: false
        default: false
      runtime_url:
        description: 'Other runtime IPK URL (https) instead of the pinned one; also builds the native package'
        required: false
        default: ''
      runtime_sha256:
        description: 'sha256 of that runtime IPK (required with runtime_url)'
        required: false
        default: ''
      model:
        description: 'TV model short name, e.g. QNED86'
        required: false
        default: ''
      model_full:
        description: 'Full model SKU, e.g. 65QNED86ASA.ATSFLJD'
        required: false
        default: ''
      firmware:
        description: 'TV firmware version'
        required: false
        default: ''
      year:
        description: 'TV model year'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runners:
    permissions:
      contents: read
    uses: ./.github/workflows/runner-setup.yml
    with:
      os: linux

  release:
    # Tag pushes only. Dispatched by hand, GITHUB_REF_NAME is the branch name and
    # gh release create would publish a release tagged after the branch.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.linux-runner) }}
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: YT-X

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            registry.npmjs.org:443
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            uploads.github.com:443
            nodejs.org:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: YT-X/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and verify
        run: npm run verify

      - name: Audit
        run: npm run audit

      - name: Package IPK
        run: npm run package:dist

      # IPKs are sideloaded, so users have no other way to verify what they
      # downloaded; publish a checksum file next to each one.
      - name: Checksums
        run: sha256sum ./*.ipk > SHA256SUMS.txt

      # Homebrew Channel: the single-app manifest and the repository feed,
      # both pointing at this release's IPK.
      - name: Homebrew manifest and feed
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          ipk="$(ls ./*.ipk | head -n1)"
          node tools/build/gen-manifest.ts youtube.leanback.v4.manifest.json --ipk-url "$base/$(basename "$ipk")"
          node tools/build/gen-repo.ts --base-url "$base"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.ipk SHA256SUMS.txt youtube.leanback.v4.manifest.json repo.json --generate-notes --title "$GITHUB_REF_NAME"

  # Native Cobalt package: manual only. The Cobalt runtime is a third-party
  # binary that is never stored in this repository. By default it is the file
  # pinned (URL, sha256, size) in YT-X/tools/native/runtime.lock.json, which
  # native.ts downloads and verifies; runtime_url + runtime_sha256 override it.
  native:
    # Dispatch from main only, so no draft is built from an unmerged commit.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.native || inputs.runtime_url != '')
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.linux-runner) }}
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: YT-X

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: YT-X/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Fetch the override runtime
        if: inputs.runtime_url != ''
        env:
          RUNTIME_URL: ${{ inputs.runtime_url }}
          RUNTIME_SHA256: ${{ inputs.runtime_sha256 }}
        run: |
          [ -n "$RUNTIME_SHA256" ] || { echo "runtime_sha256 is required with runtime_url" >&2; exit 1; }
          curl --fail --location --proto '=https' -o "$RUNNER_TEMP/runtime.ipk" "$RUNTIME_URL"
          echo "$RUNTIME_SHA256  $RUNNER_TEMP/runtime.ipk" | sha256sum --check -

      - name: Build and package native
        env:
          MODEL: ${{ inputs.model }}
          FIRMWARE: ${{ inputs.firmware }}
          YEAR: ${{ inputs.year }}
          MODEL_FULL: ${{ inputs.model_full }}
        run: |
          npm run build:fhd:cobalt
          # Without an override, native.ts fetches and verifies the pinned runtime.
          args=()
          [ -f "$RUNNER_TEMP/runtime.ipk" ] && args+=(--runtime "$RUNNER_TEMP/runtime.ipk")
          [ -n "$MODEL_FULL" ] && args+=(--model-full "$MODEL_FULL")
          if [ -n "$MODEL" ]; then
            args+=(--device-strings --model "$MODEL")
            [ -n "$FIRMWARE" ] && args+=(--firmware "$FIRMWARE")
            [ -n "$YEAR" ] && args+=(--year "$YEAR")
          fi
          node tools/native/native.ts package "${args[@]}"
          sha256sum dist-native/*.ipk > dist-native/SHA256SUMS.txt

      # A private draft release holds the package: it embeds a third-party
      # runtime, so it is not published automatically.
      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "native-$GITHUB_RUN_NUMBER" dist-native/*.ipk dist-native/SHA256SUMS.txt --draft --prerelease --title "native-$GITHUB_RUN_NUMBER" --notes "Native Cobalt package; contains the Cobalt runtime named in YT-X/tools/native/runtime.lock.json (or the override given at dispatch)."
