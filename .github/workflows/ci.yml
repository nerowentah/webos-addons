name: CI

on:
  push:
    branches: [main]
    paths:
      - 'YT-X/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'YT-X/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: YT-X

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: YT-X/package-lock.json

      - name: Install dependencies
        run: npm ci

      # verify = production webpack build + es-check against the webOS TV
      # engine target, which is the pair that actually proves the artifact
      # will load on a device.
      - name: Build and verify
        run: npm run verify

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Format check
        run: npm run prettier-check
