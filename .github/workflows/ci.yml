name: CI

on:
  push:
    branches: [main]
    paths:
      - 'YT-X/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'YT-X/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: YT-X

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            registry.npmjs.org:443
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: YT-X/package-lock.json

      - name: Install dependencies
        # Skip lifecycle scripts: this job only builds and tests, so running
        # install hooks would add attack surface with no benefit.
        run: npm ci --ignore-scripts

      - name: Unit tests
        run: npm test

      - name: Check UI text lengths
        run: npm run check:text

      # verify = production webpack build + es-check against the webOS TV
      # engine target, which is the pair that actually proves the artifact
      # will load on a device. It also re-runs the UI-text length check.
      - name: Build and verify
        run: npm run verify

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Audit
        run: npm run audit

      - name: Format check
        run: npm run prettier-check
