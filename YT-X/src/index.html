<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YouTube Extended</title>
    <!-- The shell loads only its own bundle then immediately navigates to
         https://www.youtube.com/tv, so this CSP never needs connect-src or
         frame-src traffic. The classic <script> (not type=module) and
         style-src 'unsafe-inline' are load-bearing on the Chrome 79 shell
         and for injected styles; don't "harden" them away. Keep it strict; webOS serves the bundle from
         file://, hence the explicit file: sources alongside 'self'. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; script-src 'self' file:; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <script src="index.js"></script>
  </head>
  <body></body>
</html>
